services:
  restaurant_db:
    image: postgres:17
    restart: always
    env_file: ".env"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - store-network

  restaurant-service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      restaurant_db:
        condition: service_healthy
    env_file: ".env"
    ports:
      - "8087:8087"
    networks:
      - store-network

  pgadmin:
    image: dpage/pgadmin4:9.8.0
    restart: always
    env_file: ".env"
    depends_on:
      restaurant_db:
        condition: service_healthy
    ports:
      - "7777:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - store-network

volumes:
  db_data:
  pgadmin_data:

networks:
  store-network: {}
