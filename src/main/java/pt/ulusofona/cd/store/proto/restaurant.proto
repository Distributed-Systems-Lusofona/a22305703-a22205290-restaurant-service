syntax = "proto3";

option java_multiple_files = true;
option java_package = "pt.ulusofona.cd.store";
option java_outer_classname = "RestaurantProto";

service RestaurantService {
  rpc CountDiscontinuedRestaurantsBySupplier (CountDiscontinuedRestaurantsRequest) returns (RestaurantCountResponse);
}

message CountDiscontinuedRestaurantsRequest {
  string supplier_id = 1;
  bool is_discontinued = 2;
}


message RestaurantCountResponse {
  int32 count = 1;
}